services:
  db:
    image: mysql:8.0
    container_name: tcm-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: tcm_db
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - tcm-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: tcm-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tcm_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
    networks:
      - tcm-network
    restart: always

  frontend:
    build: ./frontend
    container_name: tcm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tcm-network
    restart: always

volumes:
  db_data:

networks:
  tcm-network:
    driver: bridge
