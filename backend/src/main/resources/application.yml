server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/tcm_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # Allow hibernate to update schema if needed, but we rely on init.sql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  # Logging config
logging:
  level:
    com.example.tcm: DEBUG
    org.springframework.web: INFO

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds
app:
  cors:
    allowed-origins: http://localhost,http://localhost:5173
